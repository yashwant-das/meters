<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F4B"/>
      <stop offset="1" stop-color="#15171D"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AA9FF"/><stop offset="1" stop-color="#0A6CFF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE37D"/><stop offset="1" stop-color="#1FB850"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFBE4D"/><stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824pt body inset 100pt -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="3"/>
  <!-- tracks -->
  <g fill="#FFFFFF" fill-opacity="0.07">
    <rect x="262" y="262" width="120" height="500" rx="60"/>
    <rect x="452" y="262" width="120" height="500" rx="60"/>
    <rect x="642" y="262" width="120" height="500" rx="60"/>
  </g>
  <!-- meters -->
  <rect x="262" y="452" width="120" height="310" rx="60" fill="url(#blue)"/>
  <rect x="452" y="332" width="120" height="430" rx="60" fill="url(#green)"/>
  <rect x="642" y="562" width="120" height="200" rx="60" fill="url(#orange)"/>
</svg>
